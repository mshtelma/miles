# Train with any Miles launcher on AIR. Every node joins one Ray cluster and the head node runs LAUNCHER. Saves
# are copied to runs/<RUN_ID>/checkpoints on the Volume, and resubmitting the same RUN_ID resumes from the
# newest one. Miles logs into the job's MLflow run, named RUN_ID.
experiment_name: miles
compute:
  num_accelerators: 8  # all GPUs: 8 is one node, 16 two
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: REGISTRY/miles-air@sha256:DIGEST
code_source:
  type: snapshot
  snapshot:
    root_path: ../..  # relative to this YAML
max_retries: 0  # a failed attempt would fail the same way; AIR's default is 3
timeout_minutes: 720  # including the wait for GPUs
env_variables:
  VOLUME_ROOT: /Volumes/CATALOG/SCHEMA/VOLUME/miles
  RUN_ID: miles-run
  LAUNCHER: scripts/run_qwen3_4b.py
  LAUNCHER_ARGS: --model-dir /tmp/miles-air/models --data-dir /tmp/miles-air/data
  EXTRA_ARGS: ""  # Miles flags, after the launcher's own; on H100: --sglang-attention-backend flashinfer
  INPUTS: ""  # directories under VOLUME_ROOT that every node copies to /tmp/miles-air, e.g. models/Qwen3-4B
command: |
  set -euo pipefail
  cd "$CODE_SOURCE_PATH"
  export PYTHONPATH="$CODE_SOURCE_PATH:/root/Megatron-LM${PYTHONPATH:+:$PYTHONPATH}"
  export HF_HUB_DISABLE_XET=1 PYTHONFAULTHANDLER=1 PYTHONUNBUFFERED=1
  LOCAL=/tmp/miles-air RUN="$VOLUME_ROOT/runs/$RUN_ID"
  for input in $INPUTS; do python -m tools.air.copy_tree "$VOLUME_ROOT/$input" "$LOCAL/$input"; done
  if [ "$NODE_RANK" -ne 0 ]; then
    for _ in $(seq 360); do (exec 3<>"/dev/tcp/$MASTER_ADDR/6379") 2>/dev/null && break; sleep 5; done
    ray start --address="$MASTER_ADDR:6379" --num-gpus="$LOCAL_WORLD_SIZE" --disable-usage-stats --block || true
    exit 0  # the head node's exit code decides the job
  fi
  ray start --head --node-ip-address="$MASTER_ADDR" --port=6379 --num-gpus="$LOCAL_WORLD_SIZE" \
    --disable-usage-stats --dashboard-host=127.0.0.1
  eval "set -- $LAUNCHER_ARGS"
  set +e
  MILES_SCRIPT_EXTERNAL_RAY=1 python "$LAUNCHER" --num-nodes "$NUM_NODES" --output-dir "$LOCAL/run" "$@" \
    --extra-env-vars "MILES_PERSIST_DIR=$RUN/checkpoints" \
    --extra-args "--load $RUN/checkpoints --checkpoint-publisher-path tools.air.publisher.VolumePublisher \
      --use-mlflow --mlflow-tracking-uri databricks --mlflow-run-id $MLFLOW_RUN_ID --mlflow-run-name $RUN_ID \
      $EXTRA_ARGS"
  code=$?
  ray stop --force
  exit "$code"
