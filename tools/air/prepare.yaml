# Prepare a Miles launcher's inputs on one node and copy them to the Volume. The launcher's prepare step downloads
# the model and data and converts the checkpoint into /tmp/miles-air; each directory it fills there is copied to
# VOLUME_ROOT, every Megatron tracker last, so a partial copy is never loaded. tools/air/train.yaml then stages
# them on every node (INPUTS).
experiment_name: miles
mlflow_run_name: prepare
compute:
  num_accelerators: 8  # one node: the converters run on its GPUs
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: REGISTRY/miles-air@sha256:DIGEST
code_source:
  type: snapshot
  snapshot:
    root_path: ../..  # relative to this YAML
max_retries: 0  # a failed attempt would fail the same way; AIR's default is 3
timeout_minutes: 360  # including the wait for GPUs
env_variables:
  VOLUME_ROOT: /Volumes/CATALOG/SCHEMA/VOLUME/miles
  LAUNCHER: scripts/run_qwen3_4b.py
  LAUNCHER_ARGS: --model-dir /tmp/miles-air/models --data-dir /tmp/miles-air/data
# For gated models or datasets, add a Hugging Face token: secrets: {HF_TOKEN: SCOPE/KEY}
command: |
  set -euo pipefail
  cd "$CODE_SOURCE_PATH"
  export PYTHONPATH="$CODE_SOURCE_PATH:/root/Megatron-LM${PYTHONPATH:+:$PYTHONPATH}"
  export HF_HUB_DISABLE_XET=1 PYTHONUNBUFFERED=1
  test "$NUM_NODES" -eq 1
  LOCAL=/tmp/miles-air
  eval "set -- $LAUNCHER_ARGS"
  python -m tools.air.prepare "$LAUNCHER" "$@"
  for dir in "$LOCAL"/*/; do
    trackers=$(cd "$dir" && find . -name latest_checkpointed_iteration.txt -printf '%P ')
    python -m tools.air.copy_tree "$dir" "$VOLUME_ROOT/$(basename "$dir")" ${trackers:+--last $trackers}
  done
