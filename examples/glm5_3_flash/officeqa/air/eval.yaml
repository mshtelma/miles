# Score the base model or a training save's HF export with one SGLang server on one node. The eval logs to the
# training experiment, and the scores of a save also go into the training run at the save's step.
experiment_name: glm53-flash-officeqa
mlflow_run_name: eval
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xB300
environment:
  docker_image:
    url: REGISTRY/miles-air@sha256:DIGEST
code_source:
  type: snapshot
  snapshot:
    root_path: ../../../..  # relative to this YAML
max_retries: 1
timeout_minutes: 480
env_variables:
  VOLUME_ROOT: /Volumes/CATALOG/SCHEMA/VOLUME/miles
  HF_SOURCE: base  # or a save: <VOLUME_ROOT>/runs/<RUN_ID>/checkpoints/iter_<step>
  EVAL_RUN_ID: glm53-flash-officeqa-eval
  EVAL_ARGS: ""  # for example: --samples-per-prompt 4 --limit-questions 3
command: |
  set -euo pipefail
  cd "$CODE_SOURCE_PATH"
  export PYTHONPATH="$CODE_SOURCE_PATH:/root/Megatron-LM${PYTHONPATH:+:$PYTHONPATH}"
  test "$NUM_NODES" -eq 1
  eval "set -- $EVAL_ARGS"
  python -m examples.glm5_3_flash.officeqa.eval.entry --volume-root "$VOLUME_ROOT" --run-id "$EVAL_RUN_ID" \
    --hf-source "$HF_SOURCE" "$@"
