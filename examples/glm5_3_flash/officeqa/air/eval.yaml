# Score a base or exported HF checkpoint; more nodes add SGLang servers.
experiment_name: glm53-flash-officeqa-eval
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xB300
environment:
  docker_image:
    url: REGISTRY/miles-air@sha256:DIGEST
code_source:
  type: snapshot
  snapshot:
    root_path: ../../../..  # relative to this YAML
max_retries: 0
timeout_minutes: 480
env_variables:
  VOLUME_ROOT: /Volumes/CATALOG/SCHEMA/VOLUME/miles
  INPUT_MANIFEST: ""  # empty: inputs/latest
  HF_SOURCE: base  # or checkpoint:<absolute COMPLETE save root>
  EVAL_RUN_ID: glm53-flash-officeqa-eval
  EVAL_ARGS: ""  # for example: --samples-per-prompt 4 --limit-questions 3
command: |
  set -euo pipefail
  cd "$CODE_SOURCE_PATH"
  export PYTHONPATH="$CODE_SOURCE_PATH:/root/Megatron-LM${PYTHONPATH:+:$PYTHONPATH}"
  python -m examples.glm5_3_flash.officeqa.eval.entry --volume-root "$VOLUME_ROOT" \
    --run-id "$EVAL_RUN_ID" --input-manifest "$INPUT_MANIFEST" --hf-source "$HF_SOURCE" $EVAL_ARGS
