# Build the OfficeQA data from the databricks/officeqa dataset, download the pinned HF checkpoint and convert
# it to torch_dist; copy all three to the Volume. The torch_dist tracker is copied last, so a partial copy is
# never loaded.
experiment_name: glm53-flash-officeqa
mlflow_run_name: prepare
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xB300
environment:
  docker_image:
    url: REGISTRY/miles-air@sha256:DIGEST
code_source:
  type: snapshot
  snapshot:
    root_path: ../../../..  # relative to this YAML
max_retries: 0  # a failed attempt would fail the same way; AIR's default is 3
timeout_minutes: 360
env_variables:
  VOLUME_ROOT: /Volumes/CATALOG/SCHEMA/VOLUME/miles
secrets:
  HF_TOKEN: SCOPE/KEY  # a Hugging Face token whose account accepted the databricks/officeqa terms
command: |
  set -euo pipefail
  cd "$CODE_SOURCE_PATH"
  export PYTHONPATH="$CODE_SOURCE_PATH:/root/Megatron-LM${PYTHONPATH:+:$PYTHONPATH}"
  test "$NUM_NODES" -eq 1
  export HF_HUB_DISABLE_XET=1
  LOCAL=/tmp/miles-air
  python -m examples.glm5_3_flash.officeqa.prepare_data --out-dir "$LOCAL/data/officeqa"
  python scripts/run_glm5_3_flash.py prepare --model-dir "$LOCAL/models" --ckpt-dir "$LOCAL/ckpt" \
    --data-dir "$LOCAL/data"
  python -m tools.air.copy_tree "$LOCAL/data/officeqa" "$VOLUME_ROOT/data/officeqa"
  python -m tools.air.copy_tree "$LOCAL/models/GLM-5.3-Flash" "$VOLUME_ROOT/models/GLM-5.3-Flash"
  python -m tools.air.copy_tree "$LOCAL/ckpt/glm5.3-flash_torch_dist" "$VOLUME_ROOT/ckpt/glm5.3-flash_torch_dist" \
    --last latest_checkpointed_iteration.txt
