# Convert the prepared HF checkpoint and publish a COMPLETE reference DCP.
experiment_name: glm53-flash-officeqa
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xB300
environment:
  docker_image:
    url: REGISTRY/miles-air@sha256:DIGEST
code_source:
  type: snapshot
  snapshot:
    root_path: ../../../..  # relative to this YAML
max_retries: 0
timeout_minutes: 480
env_variables:
  VOLUME_ROOT: /Volumes/CATALOG/SCHEMA/VOLUME/miles
  INPUT_MANIFEST: ""  # empty: inputs/latest
command: |
  set -euo pipefail
  cd "$CODE_SOURCE_PATH"
  export PYTHONPATH="$CODE_SOURCE_PATH:/root/Megatron-LM${PYTHONPATH:+:$PYTHONPATH}"
  test "$NUM_NODES" -eq 1
  if [ -z "$INPUT_MANIFEST" ]; then INPUT_MANIFEST=$(cat "$VOLUME_ROOT/inputs/latest"); fi
  LOCAL=/tmp/miles-air
  python -m tools.air.stage_models stage --manifest "$INPUT_MANIFEST" --local-root "$LOCAL" \
    --model-name GLM-5.3-Flash
  python scripts/run_glm5_3_flash.py prepare --skip-download --model-dir "$LOCAL/models" \
    --ckpt-dir "$LOCAL/ckpt" --data-dir "$LOCAL/data"
  TARGET="$VOLUME_ROOT/ckpt/glm5.3-flash_torch_dist_$MLFLOW_RUN_ID"
  python -m tools.air.stage_models publish-reference --source "$LOCAL/ckpt/glm5.3-flash_torch_dist" \
    --target "$TARGET" --input-manifest "$INPUT_MANIFEST"
  echo "REFERENCE_ROOT=$TARGET"
